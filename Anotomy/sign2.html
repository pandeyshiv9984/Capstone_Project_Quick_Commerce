<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - mintoSpeed</title>
  <link rel="stylesheet" href="sign2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="signup-container">
    <div class="signup-card">
      <div class="brand">
        <h2><span class="mint">minto</span><span class="speed">Speed</span></h2>
      </div>
      <form id="signupForm" class="signup-form">
        
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required minlength="2">
        
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required minlength="5">
        
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" title="10 digit number">
        
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        
        <label>Gender</label>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required minlength="8">
          <span class="toggle-password" data-target="password"><i class="fa fa-eye"></i></span>
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
          <span class="toggle-password" data-target="confirmPassword"><i class="fa fa-eye"></i></span>
        </div>
        <div id="confirmMessage" class="inline-message"></div>

        <div class="checkbox">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the Terms & Conditions</label>
        </div>
        
        <button type="submit" class="submit-btn">Sign Up</button>
        <div class="login-text">
          Already have an account? <a href="login.html" class="login-link">Login</a>
        </div>
        <div id="message"></div>
      </form>
    </div>
  </div>
  <script src="signupscript.js"></script>
</body>
</html>
