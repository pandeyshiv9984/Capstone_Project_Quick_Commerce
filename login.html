<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - mintoSpeed</title>
  <link rel="stylesheet" href="loginstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <h2><span class="mint">minto</span><span class="speed">Speed</span></h2>
      </div>
      <form id="loginForm">
        <label for="identifier">Phone Number or Email</label>
        <input type="text" id="identifier" name="identifier" placeholder="Enter phone number or email" required>

        <label for="password">Enter Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter password" required>
          <span id="togglePassword" class="toggle-password"><i class="fa fa-eye"></i></span>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>
      <div class="register-text">
        New User? <a href="sign2.html" class="register-link">Create an Account</a>
      </div>
    </div>
  </div>
  <script src="loginscript.js"></script>
</body>
</html>
